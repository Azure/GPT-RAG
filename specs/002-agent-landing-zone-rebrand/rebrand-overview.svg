<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1b33"/>
      <stop offset="1" stop-color="#10284d"/>
    </linearGradient>
    <linearGradient id="newg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0078d4"/>
      <stop offset="1" stop-color="#5b3fd6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7cc4ff"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- Title -->
  <text x="800" y="62" text-anchor="middle" font-size="40" font-weight="700" fill="#ffffff">GPT-RAG  →  Agent Landing Zone</text>
  <text x="800" y="98" text-anchor="middle" font-size="19" fill="#a9c7ec">The former GPT-RAG Solution Accelerator, renamed and matured · Azure/GPT-RAG#695</text>

  <!-- ========== BEFORE ========== -->
  <g filter="url(#shadow)">
    <rect x="40" y="130" width="560" height="640" rx="18" fill="#1a2a44" stroke="#3b4d6b" stroke-width="2"/>
  </g>
  <text x="70" y="172" font-size="15" font-weight="700" fill="#8fa3bf" letter-spacing="2">TODAY</text>
  <text x="70" y="206" font-size="30" font-weight="700" fill="#e6edf7">GPT-RAG</text>
  <text x="70" y="232" font-size="15" fill="#8fa3bf">One RAG application, many places to look</text>

  <rect x="70" y="256" width="500" height="58" rx="10" fill="#243654"/>
  <text x="90" y="282" font-size="17" font-weight="600" fill="#e6edf7">Azure/GPT-RAG</text>
  <text x="90" y="303" font-size="14" fill="#8fa3bf">umbrella repo · manifest · azd deploy</text>

  <rect x="70" y="326" width="500" height="58" rx="10" fill="#243654"/>
  <text x="90" y="352" font-size="17" font-weight="600" fill="#e6edf7">infra/  (git submodule)</text>
  <text x="90" y="373" font-size="14" fill="#8fa3bf">Azure/bicep-ptn-aiml-landing-zone · pinned by tag</text>

  <rect x="70" y="396" width="160" height="72" rx="10" fill="#243654"/>
  <text x="150" y="428" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf7">gpt-rag-ui</text>
  <rect x="240" y="396" width="160" height="72" rx="10" fill="#243654"/>
  <text x="320" y="428" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf7">gpt-rag-</text>
  <text x="320" y="448" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf7">orchestrator</text>
  <rect x="410" y="396" width="160" height="72" rx="10" fill="#243654"/>
  <text x="490" y="428" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf7">gpt-rag-</text>
  <text x="490" y="448" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf7">ingestion</text>

  <rect x="70" y="480" width="500" height="58" rx="10" fill="#243654"/>
  <text x="90" y="506" font-size="17" font-weight="600" fill="#e6edf7">Docs on the repo's docs branch</text>
  <text x="90" y="527" font-size="14" fill="#8fa3bf">azure.github.io/GPT-RAG · long README</text>

  <rect x="70" y="550" width="500" height="58" rx="10" fill="#243654"/>
  <text x="90" y="576" font-size="17" font-weight="600" fill="#e6edf7">One deployment shape</text>
  <text x="90" y="597" font-size="14" fill="#8fa3bf">infrastructure + RAG app, always together</text>

  <text x="70" y="650" font-size="15" fill="#8fa3bf">"gpt-rag" everywhere:</text>
  <text x="70" y="674" font-size="14" fill="#6f84a3" font-family="Consolas, monospace">labels · roles · index · images · audit events</text>
  <text x="70" y="696" font-size="14" fill="#6f84a3" font-family="Consolas, monospace">aka.ms/gpt-rag/* · azd template names</text>
  <text x="70" y="740" font-size="14" fill="#8fa3bf">Existing environments keep their GPT-RAG release.</text>

  <!-- Arrow -->
  <line x1="612" y1="450" x2="668" y2="450" stroke="#7cc4ff" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="640" y="425" text-anchor="middle" font-size="13" fill="#7cc4ff" font-weight="600">rename</text>
  <text x="640" y="485" text-anchor="middle" font-size="13" fill="#7cc4ff" font-weight="600">consolidate</text>

  <!-- ========== AFTER ========== -->
  <g filter="url(#shadow)">
    <rect x="685" y="130" width="875" height="640" rx="18" fill="#12325e" stroke="url(#newg)" stroke-width="3"/>
  </g>
  <text x="715" y="172" font-size="15" font-weight="700" fill="#7cc4ff" letter-spacing="2">NEXT · v4.0.0</text>
  <text x="715" y="206" font-size="30" font-weight="700" fill="#ffffff">Agent Landing Zone</text>
  <text x="715" y="232" font-size="15" fill="#a9c7ec">A governed foundation plus a replaceable agent application · repo: Azure/agent-landing-zone</text>

  <!-- Application layer -->
  <rect x="715" y="256" width="560" height="200" rx="14" fill="#1b4680" stroke="#4a8fe0" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="735" y="284" font-size="17" font-weight="700" fill="#ffffff">Application layer  (optional)</text>
  <text x="735" y="305" font-size="14" fill="#a9c7ec">first app: the proven UI · orchestrator · ingestion trio</text>
  <rect x="735" y="322" width="165" height="70" rx="10" fill="url(#newg)"/>
  <text x="817" y="352" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">agent-app-ui</text>
  <text x="817" y="373" text-anchor="middle" font-size="12" fill="#dbe9ff">chat experience</text>
  <rect x="912" y="322" width="165" height="70" rx="10" fill="url(#newg)"/>
  <text x="994" y="347" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">agent-app-</text>
  <text x="994" y="366" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">orchestrator</text>
  <text x="994" y="384" text-anchor="middle" font-size="12" fill="#dbe9ff">classic | hosted agent</text>
  <rect x="1089" y="322" width="165" height="70" rx="10" fill="url(#newg)"/>
  <text x="1171" y="352" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">agent-app-</text>
  <text x="1171" y="371" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">ingestion</text>
  <text x="995" y="430" text-anchor="middle" font-size="13" fill="#a9c7ec">Future: other agent application patterns on the same foundation</text>

  <!-- Infra layer -->
  <rect x="715" y="470" width="560" height="170" rx="14" fill="#173a6b" stroke="#4a8fe0" stroke-width="1.5"/>
  <text x="735" y="498" font-size="17" font-weight="700" fill="#ffffff">Infrastructure layer  (the foundation)</text>
  <text x="735" y="519" font-size="14" fill="#a9c7ec">Bicep now lives in the repo — no more submodule</text>
  <g font-size="13" fill="#e6edf7" font-weight="600">
    <rect x="735" y="536" width="100" height="40" rx="8" fill="#23518f"/><text x="785" y="561" text-anchor="middle">Networking</text>
    <rect x="843" y="536" width="100" height="40" rx="8" fill="#23518f"/><text x="893" y="561" text-anchor="middle">Identity</text>
    <rect x="951" y="536" width="100" height="40" rx="8" fill="#23518f"/><text x="1001" y="561" text-anchor="middle">Foundry</text>
    <rect x="1059" y="536" width="90" height="40" rx="8" fill="#23518f"/><text x="1104" y="561" text-anchor="middle">Data</text>
    <rect x="1157" y="536" width="98" height="40" rx="8" fill="#23518f"/><text x="1206" y="561" text-anchor="middle">Monitoring</text>
  </g>
  <text x="735" y="608" font-size="13" fill="#a9c7ec">Terraform stays in its AVM module, kept in parity by automated sync + human review.</text>
  <text x="735" y="628" font-size="13" fill="#a9c7ec">bicep-ptn-aiml-landing-zone: notice pointing here, no new development.</text>

  <!-- Deployment options -->
  <text x="1300" y="284" font-size="17" font-weight="700" fill="#ffffff">Choose what to deploy</text>
  <rect x="1300" y="302" width="235" height="150" rx="12" fill="#0f2a50" stroke="#7cc4ff" stroke-width="2"/>
  <text x="1318" y="332" font-size="16" font-weight="700" fill="#7cc4ff">① Infra + application</text>
  <text x="1318" y="354" font-size="13" fill="#e6edf7">Default. Full working</text>
  <text x="1318" y="372" font-size="13" fill="#e6edf7">agent app, classic or</text>
  <text x="1318" y="390" font-size="13" fill="#e6edf7">Foundry hosted agent.</text>
  <text x="1318" y="428" font-size="12" fill="#a9c7ec">Available in the preview</text>
  <rect x="1300" y="470" width="235" height="170" rx="12" fill="#0f2a50" stroke="#b08cff" stroke-width="2"/>
  <text x="1318" y="500" font-size="16" font-weight="700" fill="#c9b3ff">② Infrastructure only</text>
  <text x="1318" y="522" font-size="13" fill="#e6edf7">Governed foundation for</text>
  <text x="1318" y="540" font-size="13" fill="#e6edf7">your own agents. Add the</text>
  <text x="1318" y="558" font-size="13" fill="#e6edf7">app later — foundation</text>
  <text x="1318" y="576" font-size="13" fill="#e6edf7">is not re-created.</text>
  <text x="1318" y="618" font-size="12" fill="#a9c7ec">New in v4.0.0</text>

  <!-- Docs strip -->
  <rect x="715" y="656" width="820" height="92" rx="12" fill="#0f2a50"/>
  <text x="735" y="684" font-size="16" font-weight="700" fill="#ffffff">One source of truth for docs</text>
  <text x="735" y="708" font-size="14" fill="#a9c7ec">Agent Landing Zone section of the central AI Landing Zones documentation</text>
  <text x="735" y="730" font-size="14" fill="#a9c7ec">README becomes a short landing page: what it is, a diagram, and where to go next</text>

  <!-- ========== TIMELINE ========== -->
  <text x="40" y="822" font-size="15" font-weight="700" fill="#8fa3bf" letter-spacing="2">DELIVERY</text>
  <line x1="120" y1="890" x2="1480" y2="890" stroke="#3b4d6b" stroke-width="4"/>

  <circle cx="200" cy="890" r="12" fill="#8fa3bf"/>
  <text x="200" y="860" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf7">2026-09-29</text>
  <text x="200" y="925" text-anchor="middle" font-size="13" fill="#a9c7ec">Spec · ADR · constitution</text>
  <text x="200" y="943" text-anchor="middle" font-size="13" fill="#a9c7ec">amendments first</text>

  <circle cx="620" cy="890" r="14" fill="#0078d4"/>
  <text x="620" y="860" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Phase 1 · by 2026-10-02</text>
  <text x="620" y="925" text-anchor="middle" font-size="13" fill="#a9c7ec">v4.0.0-preview.1 — public rebrand</text>
  <text x="620" y="943" text-anchor="middle" font-size="13" fill="#a9c7ec">repos renamed · new README · UI branding</text>
  <text x="620" y="961" text-anchor="middle" font-size="13" fill="#a9c7ec">no broken short links</text>

  <circle cx="1060" cy="890" r="14" fill="#5b3fd6"/>
  <text x="1060" y="860" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Phases 2 + 3 · by 2026-10-09</text>
  <text x="1060" y="925" text-anchor="middle" font-size="13" fill="#a9c7ec">v4.0.0 — infra in repo · infra-only option</text>
  <text x="1060" y="943" text-anchor="middle" font-size="13" fill="#a9c7ec">runtime names renamed · full docs migration</text>
  <text x="1060" y="961" text-anchor="middle" font-size="13" fill="#a9c7ec">zero "gpt-rag" scan · end-to-end validation</text>

  <circle cx="1400" cy="890" r="12" fill="none" stroke="#c9b3ff" stroke-width="3"/>
  <text x="1400" y="860" text-anchor="middle" font-size="15" font-weight="700" fill="#c9b3ff">Microsoft Ignite</text>
  <text x="1400" y="925" text-anchor="middle" font-size="13" fill="#a9c7ec">November 2026</text>
  <text x="1400" y="943" text-anchor="middle" font-size="13" fill="#a9c7ec">ready well ahead</text>

  <text x="1560" y="988" text-anchor="end" font-size="11" fill="#5f7392">Based on specs/002-agent-landing-zone-rebrand/spec.md · new deployments only</text>
</svg>
