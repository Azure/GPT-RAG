site_name: GPT-RAG
site_description: Official project documentation
site_author: Paulo Lacerda
repo_url: https://github.com/azure/gpt-rag
theme:
  name: material
  custom_dir: overrides
  language: en
  logo: media/logo.png
  favicon: favicon.ico
  palette:
    scheme: default
  features:
    - content.icon
    - content.iconify
    - navigation.tracking
    - toc.integrate
    - content.code.annotate
    - navigation.top
plugins:
  - search
  - macros
  - redirects:
      redirect_maps:
        howto_retrieval_backend.md: howto_grounding_foundry_iq_documents.md
        howto_work_iq.md: howto_grounding_work_iq.md
        howto_grounding_fabric_iq.md: howto_grounding_fabric_ontology.md
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
nav:
  - Home: index.md
  - What's New: whatisnew.md
  - Release Walkthrough: release_267_270_walkthrough.md
  - Deployment Guide: deploy.md
  - Quick Start Guides:
    - Simple RAG: quickstart_simple_rag.md
    - NL2SQL: quickstart_nl2sql.md
  - Architecture:
    - Overview: architecture.md
  - Services:
    - Orchestrator: services_orchestrator.md
    - Ingestion:
        - Overview: services_ingestion.md
        - Blob: ingestion_blob_data_source.md
        - Sharepoint: ingestion_sharepoint_source.md
        - NL2SQL: ingestion_nl2sql_data_source.md
  - How-to Guides:
    - Azure Direct Models: howto_azure_direct.md
    - Application Gateway: howto_app_gateway.md
    - Auth & Doc Security: howto_authentication.md
    - Admin Dashboard Sign-in: howto_dashboard_signin.md
    - Grounding sources:
      - Overview (start here): howto_grounding_overview.md
      - 'Approach A: Foundry IQ Knowledge Base':
        - Prerequisites: howto_grounding_foundry_iq_prereqs.md
        - Documents: howto_grounding_foundry_iq_documents.md
        - Work IQ (Microsoft 365): howto_grounding_work_iq.md
        - Fabric ontology (preview): howto_grounding_fabric_ontology.md
        - Fabric Data Agent (preview): howto_grounding_fabric_data_agent.md
        - SharePoint remote (preview): howto_grounding_sharepoint_remote.md
        - SharePoint indexed (preview): howto_grounding_sharepoint_indexed.md
        - OneLake (preview): howto_grounding_onelake.md
        - Web grounding (preview): howto_grounding_web_bing.md
      - 'Approach B: Azure AI Search direct':
        - Overview: howto_grounding_ai_search_direct.md
        - SharePoint connector: howto_sharepoint_connector.md
    - Multimodality: howto_multimodality.md
    - User Feedback: howto_userfeedback.md
    - Retrieval Optimization: howto_retrieval_optimization.md
    - Resource Naming (CAF): howto_resource_naming.md
    - Troubleshooting: troubleshooting.md
  - Meet the Team: team.md
  - Contributing: contributing.md    
extra:
  generator: false
extra_css:
  - styles.css  
extra_javascript:
  - javascripts/source-facts-refresh.js
