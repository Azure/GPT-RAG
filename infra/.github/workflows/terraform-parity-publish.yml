name: terraform-parity-publish

on:
  workflow_dispatch:
    inputs:
      handoffPath:
        description: Repository-relative path of the approved Terraform handoff record
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-parity-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Dispatch an approved parity handoff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: terraform-parity-publication
    permissions:
      contents: read
    steps:
      - name: Check out trusted repository content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the assessment ledger branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: terraform-parity-assessments
          path: .parity-ledger
          persist-credentials: false

      - name: Install pinned JSON Schema validator
        run: npm ci --ignore-scripts

      - name: Validate parity assets
        shell: pwsh
        run: |
          ./scripts/parity/Test-ParityAssets.ps1 `
            -AssessmentsPath '.parity-ledger/parity/assessments'

      - name: Mint an ephemeral single-repository App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PARITY_DISPATCH_APP_ID }}
          private-key: ${{ secrets.PARITY_DISPATCH_APP_PRIVATE_KEY }}
          owner: Azure
          repositories: terraform-azurerm-avm-ptn-aiml-landing-zone

      - name: Publish the approved handoff
        shell: pwsh
        env:
          PARITY_HANDOFF_PATH: ${{ inputs.handoffPath }}
          PARITY_HANDOFF_COMMIT_SHA: ${{ github.sha }}
          PARITY_HANDOFF_REF: ${{ github.ref_name }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          ./scripts/parity/Publish-TerraformHandoff.ps1 `
            -HandoffPath "$env:PARITY_HANDOFF_PATH" `
            -HandoffCommitSha "$env:PARITY_HANDOFF_COMMIT_SHA" `
            -HandoffRef "$env:PARITY_HANDOFF_REF" `
            -AssessmentsPath '.parity-ledger/parity/assessments' `
            -PayloadPath '.parity-dispatch/payload.json' `
            -DispatchCommand 'gh,api,--method,POST,/repos/Azure/terraform-azurerm-avm-ptn-aiml-landing-zone/dispatches,--input'
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the approved parity handoff failed.' }
