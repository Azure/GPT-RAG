name: terraform-parity-assess

on:
  pull_request_target:
    types:
      - closed
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: terraform-parity-assessment-ledger
  cancel-in-progress: false

jobs:
  assess:
    name: Record merged pull request assessment
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the trusted merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Check out the dedicated assessment ledger branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: terraform-parity-assessments
          path: .parity-ledger
          fetch-depth: 0

      - name: Install pinned JSON Schema validator
        run: npm ci --ignore-scripts

      - name: Record the merged pull request assessment
        shell: pwsh
        env:
          PARITY_REPOSITORY: ${{ github.repository }}
          PARITY_PR_NUMBER: ${{ github.event.pull_request.number }}
          PARITY_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PARITY_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          PARITY_MERGED_AT: ${{ github.event.pull_request.merged_at }}
          PARITY_MERGED: ${{ github.event.pull_request.merged }}
        run: |
          pwsh -NoProfile -File ./scripts/parity/New-AlignmentAssessment.ps1 `
            -Repository "$env:PARITY_REPOSITORY" `
            -PullRequestNumber ([int]"$env:PARITY_PR_NUMBER") `
            -MergeCommitSha "$env:PARITY_MERGE_SHA" `
            -BaseBranch "$env:PARITY_BASE_BRANCH" `
            -MergedAt "$env:PARITY_MERGED_AT" `
            -Merged "$env:PARITY_MERGED" `
            -LedgerPath '.parity-ledger/parity/assessments'
          if ($LASTEXITCODE -ne 0) { throw 'Recording the merged pull request assessment failed.' }

      - name: Validate ledger records against pinned schemas
        shell: pwsh
        run: |
          $records = Get-ChildItem -LiteralPath '.parity-ledger/parity/assessments' -Filter '*.json' -File -Recurse
          foreach ($record in $records) {
            $relative = [IO.Path]::GetRelativePath((Get-Location).Path, $record.FullName).Replace('\', '/')
            ./scripts/parity/Test-ParityJson.ps1 -Path $relative
            if ($LASTEXITCODE -ne 0) { throw "Schema validation failed for $relative." }
          }

      - name: Prove the ledger checkout stays append-only
        shell: pwsh
        run: |
          ./scripts/parity/Test-LedgerAppendOnly.ps1 -GitRepositoryPath '.parity-ledger'
          if ($LASTEXITCODE -ne 0) { throw 'The assessment ledger checkout is not append-only.' }

      - name: Append the record to the assessment ledger branch
        shell: pwsh
        working-directory: .parity-ledger
        env:
          PARITY_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $ledgerBranch = 'terraform-parity-assessments'
          $status = @(git status --porcelain --untracked-files=all)
          if ($status.Count -eq 0) {
            Write-Host 'No new assessment record to append.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add parity/assessments
          $number = [int]"$env:PARITY_PR_NUMBER"
          git commit -m "chore(parity): record assessment for merged pull request $number"
          git push origin "HEAD:$ledgerBranch"
