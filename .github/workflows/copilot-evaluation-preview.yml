name: Copilot evaluation deployment preview

on:
  push:
    branches:
      - placerda-feature-copilot-azure-oidc
    paths:
      - ".github/workflows/copilot-evaluation-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: copilot
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_ENV_NAME: gptrag-evaluation
      AZURE_RESOURCE_GROUP: rg-gptrag-evaluation
      AZURE_LOCATION: eastus
      AZURE_PRINCIPAL_ID: f4be7297-7532-4582-b0b5-53e7413879dd
      NO_COLOR: "1"
    steps:
      - name: Checkout repository and pinned infrastructure
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@003306647c7696088e6dff0900435682cb5e6ebd
        with:
          version: 1.28.1

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Configure fixed evaluation environment
        shell: bash
        run: |
          set -euo pipefail
          azd config set auth.useAzCliAuth true
          azd env new "$AZURE_ENV_NAME" \
            --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            --location "$AZURE_LOCATION" \
            --no-prompt
          azd env set --environment "$AZURE_ENV_NAME" --no-prompt \
            "AZURE_ENV_NAME=$AZURE_ENV_NAME" \
            "AZURE_RESOURCE_GROUP=$AZURE_RESOURCE_GROUP" \
            "AZURE_SUBSCRIPTION_ID=${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            "AZURE_TENANT_ID=${{ vars.AZURE_TENANT_ID }}" \
            "AZURE_LOCATION=$AZURE_LOCATION" \
            "AZURE_AI_FOUNDRY_LOCATION=$AZURE_LOCATION" \
            "AZURE_COSMOS_LOCATION=$AZURE_LOCATION" \
            "AZURE_SEARCH_LOCATION=$AZURE_LOCATION" \
            "AZURE_SPEECH_LOCATION=$AZURE_LOCATION" \
            "AZURE_PE_LOCATION=$AZURE_LOCATION" \
            "AZURE_PRINCIPAL_ID=$AZURE_PRINCIPAL_ID" \
            "AZURE_PRINCIPAL_TYPE=ServicePrincipal" \
            "DEPLOYMENT_MODE=standalone" \
            "NETWORK_ISOLATION=false" \
            "USE_UAI=false" \
            "USE_CAPP_API_KEY=false" \
            "USE_EXISTING_VNET=false" \
            "DEPLOY_VM=false" \
            "DEPLOY_SOFTWARE=false" \
            "DEPLOY_JUMPBOX=false" \
            "DEPLOY_BASTION=false" \
            "DEPLOY_NAT_GATEWAY=false" \
            "DEPLOY_AZURE_FIREWALL=false" \
            "DEPLOY_SUBNETS=false" \
            "SIDE_BY_SIDE=false" \
            "GPT_RAG_REGIONAL_PREFLIGHT_SKIP=true" \
            "LZ_PREFLIGHT_REGIONAL_SKIP=true" \
            "AZURE_PE_RESOURCE_GROUP_NAME=" \
            "EXISTING_VNET_RESOURCE_ID=" \
            "EXISTING_LOG_ANALYTICS_WORKSPACE_RESOURCE_ID=" \
            "EXISTING_APPLICATION_INSIGHTS_RESOURCE_ID=" \
            "EXISTING_APPLICATION_INSIGHTS_CONNECTION_STRING=" \
            "HUB_INTEGRATION_EGRESS_NEXT_HOP_IP=" \
            "HUB_INTEGRATION_EXISTING_ROUTE_TABLE_RESOURCE_ID=" \
            "HUB_INTEGRATION_HUB_VNET_RESOURCE_ID="

      - name: Preview GPT-RAG infrastructure
        shell: bash
        run: |
          set -euo pipefail
          azd provision --preview --no-prompt 2>&1 | tee what-if.txt

          if grep -Eiq '(^|[[:space:]])Delete([[:space:]]|$)' what-if.txt; then
            echo "Unexpected delete operation in What-If." >&2
            exit 1
          fi

          foreign_groups="$(
            grep -Eio '/subscriptions/[0-9a-f-]+/resourceGroups/[^/[:space:]]+' what-if.txt |
              grep -Fvi '/resourceGroups/rg-gptrag-evaluation' || true
          )"
          if [ -n "$foreign_groups" ]; then
            echo "Unexpected cross-resource-group scope in What-If:" >&2
            echo "$foreign_groups" >&2
            exit 1
          fi
