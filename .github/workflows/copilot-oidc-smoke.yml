name: Copilot OIDC smoke test

on:
  push:
    branches:
      - placerda-feature-copilot-azure-oidc
    paths:
      - ".github/workflows/copilot-oidc-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-oidc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: copilot
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure discovery access
        shell: bash
        run: |
          set -euo pipefail
          test "$(az account show --query id --output tsv)" = "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          az group show --name rg-gpt-rag-copilot-agent --query id --output tsv >/dev/null
